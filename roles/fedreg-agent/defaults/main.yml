---

# ALL VARIABLES FILLED WITH REAL VALUES BY
# Jan Pavlíček (xpavli95@stud.fit.vutbr.cz)

# defaults file for fedreg-agent
build_branch: thesis
deployer_ssp_name: deployer_ssp_test
deployer_mitreid_name: deployer_mitreid_demo
deployer_keycloak_name: deployer_keycloak_demo
deployer_cas_name: deployer_cas_thesis
deployers_config_name: deployers_demo.config

# Virtualenv path
fedreg_agent_venv_command: "python3 -m venv"
fedreg_agent_venv_path: "/src/fedregistryagent_{{ build_branch }}"
fedreg_agent_conf_dir: "/etc/fedregistryagent_{{ build_branch }}"

# Git
fedreg_agent_registry_requirements_url: "https://raw.githubusercontent.com/xpavlic/rciam-federation-registry-agent/refs/heads/{{ build_branch }}/requirements.txt"

# Service
fedreg_agent_services_path: /etc/systemd/system
fedreg_agent_log_conf: "{{ fedreg_agent_conf_dir }}/logger.conf"
fedreg_agent_enable_ssp: no
fedreg_agent_enable_mitreid: no
fedreg_agent_enable_keycloak: no
fedreg_agent_enable_cas: yes

## Federation registry agent parameters
fedreg_agent_ams:
   host: "api.devel.msg.argo.grnet.gr"
   project: "rciam-service-registry"
   pub_topic: "cesnet-deployment-results-topic"
   token: "<ANONYMIZED>"
   time_interval: 10

