# Updated by Jan Pavlíček (xpavli95@stud.fit.vutbr.cz)
- name: Create deployer configuration file
  copy:
    content: "{{ lookup('template', 'templates/deployers.config.json.j2') | to_nice_json }}"
    dest: "{{ fedreg_agent_conf_dir }}/{{ deployers_config_name }}"
    backup: yes
  when: fedreg_agent_enable_ssp or fedreg_agent_enable_mitreid or fedreg_agent_enable_keycloak or fedreg_agent_enable_cas
  become: yes
  tags:
    - agent
    - config

- name: Create MITREid deployer service file
  template:
    src: deployer_mitreid.service.j2
    dest: "{{ fedreg_agent_services_path }}/{{ deployer_mitreid_name }}.service"
    backup: yes
  register: mitreid_service
  when: fedreg_agent_enable_mitreid
  become: yes
  tags:
    - agent
    - service

- name: Create Keycloak deployer service file
  template:
    src: deployer_keycloak.service.j2
    dest: "{{ fedreg_agent_services_path }}/{{ deployer_keycloak_name }}.service"
    backup: yes
  register: keycloak_service
  when: fedreg_agent_enable_keycloak
  become: yes
  tags:
    - agent
    - service

- name: Create SSP deployer service file
  template:
    src: deployer_ssp.service.j2
    dest: "{{ fedreg_agent_services_path }}/{{ deployer_ssp_name }}.service"
    backup: yes
  register: ssp_service
  when: fedreg_agent_enable_ssp
  become: yes
  tags:
    - agent
    - service

# Added by Jan Pavlíček (xpavli95@stud.fit.vutbr.cz)
- name: Create CAS deployer service file
  template:
    src: deployer_cas.service.j2
    dest: "{{ fedreg_agent_services_path }}/{{ deployer_cas_name }}.service"
    backup: yes
  register: cas_service
  when: fedreg_agent_enable_cas
  become: yes
  tags:
    - agent
    - service

- name: Reload systemd
  command: systemctl daemon-reload
  when: mitreid_service.changed or ssp_service.changed or keycloak_service.changed
  become: yes
  tags:
    - agent
    - service
    - daemon-reload


- name: MitreId federation registry service enable
  service:
    name: '{{ deployer_mitreid_name }}'
    enabled: yes
    state: restarted
  when: fedreg_agent_enable_mitreid
  become: yes
  tags:
    - agent
    - service
    - service_enable

- name: Keycloak deployer service enable
  service:
    name: '{{ deployer_keycloak_name }}'
    enabled: yes
    state: restarted
  when: fedreg_agent_enable_keycloak
  become: yes
  tags:
    - agent
    - service
    - service_enable

- name: SSP federation registry service enable
  service:
    name: '{{ deployer_ssp_name }}'
    enabled: yes
    state: restarted
  when: fedreg_agent_enable_ssp
  become: yes
  tags:
    - agent
    - service
    - service_enable

# Added by Jan Pavlíček (xpavli95@stud.fit.vutbr.cz)
- name: CAS deployer service enable
  service:
    name: '{{ deployer_cas_name }}'
    enabled: yes
    state: restarted
  when: fedreg_agent_enable_cas
  become: yes
  tags:
    - agent
    - service
    - service_enable
